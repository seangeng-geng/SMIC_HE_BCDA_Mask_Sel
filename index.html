<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>HE BCDA Mask Tool</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#0d1117;color:#c9d1d9;font-size:13px}
.hdr{background:#161b22;padding:10px 16px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hdr h1{font-size:15px;color:#58a6ff}
.hdr .sub{color:#8b949e;font-size:11px}
.tabs{display:flex;margin-left:auto}
.tab{padding:5px 14px;cursor:pointer;border:1px solid #30363d;background:#161b22;color:#8b949e;font-size:11px}
.tab:first-child{border-radius:5px 0 0 5px}
.tab:last-child{border-radius:0 5px 5px 0}
.tab.active{background:#1f6feb;border-color:#1f6feb;color:#fff}
.wrap{display:flex;height:calc(100vh - 42px)}
.left{width:340px;min-width:340px;background:#161b22;border-right:1px solid #30363d;overflow-y:auto;padding:6px 0}
.right{flex:1;overflow-y:auto;padding:14px}
.ct{background:#1c2129;padding:5px 10px;font-weight:600;font-size:11px;color:#58a6ff;cursor:pointer;display:flex;justify-content:space-between;user-select:none;position:sticky;top:0;z-index:1}
.ct:hover{background:#21262d}
.ct .arr{transition:transform .2s;font-size:9px}
.ct.col .arr{transform:rotate(-90deg)}
.cb{padding:3px 0}
.cb.hid{display:none}
.dr{display:flex;align-items:center;padding:2px 10px;gap:6px;cursor:pointer}
.dr:hover{background:#1c2129}
.dr input{accent-color:#58a6ff;cursor:pointer}
.dr label{flex:1;font-size:10px;color:#c9d1d9;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr .mc{font-size:9px;color:#6e7681;min-width:30px;text-align:right}
.sb{width:calc(100% - 12px);margin:3px 6px 6px;padding:5px 8px;border:1px solid #30363d;border-radius:5px;background:#0d1117;color:#c9d1d9;font-size:11px}
.sb:focus{outline:none;border-color:#58a6ff}
.right h2{font-size:14px;color:#58a6ff;margin-bottom:10px}
.sum{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:10px;margin-bottom:12px;display:flex;gap:20px}
.sum .cnt{font-size:22px;font-weight:700;color:#3fb950}
.sum .lbl{font-size:10px;color:#8b949e}
.brow{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.btn{padding:5px 12px;border:1px solid #30363d;border-radius:5px;background:#161b22;color:#c9d1d9;font-size:11px;cursor:pointer}
.btn:hover{border-color:#58a6ff;color:#58a6ff}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:5px;margin-bottom:14px}
.mc2{background:#161b22;border:1px solid #30363d;border-radius:5px;padding:4px 8px;font-size:10px;display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.mc2.active{background:#1f6feb;border-color:#1f6feb;color:#fff}
.mc2:hover{border-color:#58a6ff}
.mc2 .dot{width:7px;height:7px;border-radius:50%;background:#30363d;flex-shrink:0}
.mc2.active .dot{background:#3fb950}
.mc2 .badge{margin-left:auto;font-size:9px;color:#6e7681}
.mc2.active .badge{color:rgba(255,255,255,.6)}
.md{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:12px;margin-bottom:12px;display:none}
.md.show{display:block}
.md h3{font-size:13px;color:#f0883e;margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.md h3 .x{cursor:pointer;color:#8b949e;margin-left:auto;font-size:14px}
.md h3 .x:hover{color:#f85149}
.md .sel-info{font-size:10px;color:#8b949e;margin-bottom:6px}
.md .dl{max-height:280px;overflow-y:auto}
.md .di{padding:3px 6px;font-size:11px;display:flex;gap:6px;align-items:center}
.md .di:hover{background:#1c2129;border-radius:3px}
.md .di .tg{font-size:9px;color:#8b949e;background:#21262d;padding:1px 5px;border-radius:2px;min-width:50px;text-align:center}
.md .ci{font-size:10px;color:#8b949e;margin-bottom:6px}
.leg{background:#161b22;border:1px solid #30363d;border-radius:5px;padding:8px;margin-bottom:10px;font-size:10px;color:#8b949e}
.leg span{margin-right:10px}
.leg .d1{color:#3fb950}
.leg .d0{color:#f85149}
.leg .ds{color:#d29922}
.match-mode{font-size:10px;color:#8b949e;margin-bottom:8px;display:flex;gap:12px;align-items:center}
.match-mode label{cursor:pointer;display:flex;align-items:center;gap:4px}
.match-mode input{accent-color:#58a6ff}
</style></head><body>
<div class="hdr">
  <h1>HE BCDA - Mask Mapping</h1>
  <span class="sub">Device &harr; Mask Layer</span>
  <div class="tabs">

        <div class="ci" id="mdc"></div>
        <div class="dl" id="mdl"></div>
      </div>
    </div>
  </div>
</div>

let mode=0,sel=new Set(),cats={},selMasks=new Set();
DEV.forEach(function(d){var k=d.c||'Other';if(!cats[k])cats[k]=[];cats[k].push(d);});

function setMode(m){
  mode=m;
  document.getElementById('t1').className='tab'+(m===0?' active':'');
  document.getElementById('t2').className='tab'+(m===1?' active':'');
  document.getElementById('m0').style.display=m===0?'block':'none';
  document.getElementById('m1').style.display=m===1?'block':'none';
  document.querySelector('.left').style.display=m===0?'':'none';
  if(m===0)renderLeft(); else renderMasks();
}

function renderLeft(){
  var p=document.getElementById('lp');
  var h='<input class="sb" placeholder="Search..." oninput="filtDev(this.value)">';
  for(var cat in cats){
    var devs=cats[cat];
    var id='c_'+cat.replace(/[^a-zA-Z0-9]/g,'_');
    h+='<div class="ct" onclick="togCat(\''+id+'\')">'+cat+' <span class="arr">&#9660;</span></div>';
    h+='<div class="cb" id="'+id+'">';
    devs.forEach(function(d){
      var rc=0;for(var k in d.mk)if(d.mk[k]==='1')rc++;
      h+='<div class="dr"><input type="checkbox" id="d_'+d.m+'" '+(sel.has(d.m)?'checked':'')+' onchange="togDev(\''+d.m+'\')"><label for="d_'+d.m+'" title="'+d.d+'">'+d.m+'</label><span class="mc">'+rc+'</span></div>';
    });
    h+='</div>';
  }
  p.innerHTML=h;
  updMasks();
}

function togCat(id){var e=document.getElementById(id);var t=e.previousElementSibling;e.classList.toggle('hid');t.classList.toggle('col');}
function togDev(m){if(sel.has(m))sel.delete(m);else sel.add(m);updMasks();}
function selAll(){DEV.forEach(function(d){sel.add(d.m);});renderLeft();}
function deselAll(){sel.clear();renderLeft();}
function filtDev(q){q=q.toLowerCase();document.querySelectorAll('.dr').forEach(function(r){var l=r.querySelector('label');if(l)r.style.display=l.textContent.toLowerCase().indexOf(q)>=0?'':'none';});}

function updMasks(){
  var g=document.getElementById('mg1');
  var cnt={};MASKS.forEach(function(m){cnt[m]=0;});
  sel.forEach(function(m){var d=DEV.find(function(x){return x.m===m;});if(d){for(var k in d.mk)if(d.mk[k]==='1')cnt[k]++;}});
  var h='';
  MASKS.forEach(function(m){var a=cnt[m]>0;h+='<div class="mc2'+(a?' active':'')+'"><span class="dot"></span><span>'+m+'</span><span class="badge">'+(a?cnt[m]+' dev':'')+'</span></div>';});
  g.innerHTML=h;
  document.getElementById('dc').textContent=sel.size;
  document.getElementById('mc').textContent=Object.values(cnt).filter(function(c){return c>0;}).length;
}

function renderMasks(){
  var g=document.getElementById('mg2');
  var h='';
  MASKS.forEach(function(m){
    var a=selMasks.has(m);
    h+='<div class="mc2'+(a?' active':'')+'" onclick="togMask(\''+m+'\')"><span class="dot"></span><span>'+m+'</span></div>';
  });
  g.innerHTML=h;
  updMaskResult();
}

function togMask(m){
  if(selMasks.has(m))selMasks.delete(m);else selMasks.add(m);
  renderMasks();
}

function deselMasks(){
  selMasks.clear();
  renderMasks();
  document.getElementById('mdet').classList.remove('show');
}

function updMaskResult(){
  document.getElementById('msc').textContent=selMasks.size;
  var matchMode=document.querySelector('input[name="mm"]:checked').value;
  var selArr=Array.from(selMasks);
  var matching=[];
  DEV.forEach(function(d){
    if(selMasks.size===0)return;
    if(matchMode==='any'){
      for(var i=0;i<selArr.length;i++){if(d.mk[selArr[i]]==='1'){matching.push(d);break;}}
    }else{
      var all=true;
      for(var i=0;i<selArr.length;i++){if(d.mk[selArr[i]]!=='1'){all=false;break;}}
      if(all)matching.push(d);
    }
  });
  document.getElementById('mdc2').textContent=matching.length;
  if(selMasks.size>0){
    var det=document.getElementById('mdet');
    document.getElementById('mdn').textContent='Devices matching '+selArr.length+' mask(s)';
    document.getElementById('mselinfo').textContent='Selected: '+selArr.join(', ')+' | Mode: '+(matchMode==='any'?'ANY':'ALL');
    var h='<div style="margin-bottom:6px;font-weight:600;color:#3fb950;font-size:11px">Matching ('+matching.length+'):</div>';
    matching.forEach(function(d){
      var usedMasks=[];
      selArr.forEach(function(m){if(d.mk[m]==='1')usedMasks.push(m);});
      h+='<div class="di"><span class="tg">'+d.c+'</span><span>'+d.m+'</span><span style="color:#3fb950;font-size:9px">['+usedMasks.join(',')+']</span><span style="color:#6e7681;font-size:9px">'+d.d+'</span></div>';
    });
    document.getElementById('mdl').innerHTML=h;
    det.classList.add('show');
  }else{
    document.getElementById('mdet').classList.remove('show');
  }
}

setMode(0);
</script></body></html>
